<style>
:root {
  --bg: #171512;
  --bg-raised: #1e1b17;
  --text: #f5f1e8;
  --text-dim: #a89f8f;
  --line: #33302a;
  --sage: #7a8c6f;
  --sage-dim: #4f5a48;
  --amber: #d8a24a;
  --font-display: "Fraunces", serif;
  --font-body: "Space Grotesk", sans-serif;
}

/* ---------- Thèmes (Réglages) ---------- */

[data-theme="nuit"] {
  --bg: #11151c;
  --bg-raised: #171c26;
  --line: #2b323e;
  --sage: #7691b5;
  --sage-dim: #455063;
}

[data-theme="foret"] {
  --bg: #131810;
  --bg-raised: #1a2116;
  --line: #2e3828;
  --sage: #7fa06a;
  --sage-dim: #4d5f42;
}

[data-theme="bordeaux"] {
  --bg: #1a1114;
  --bg-raised: #22161a;
  --line: #3a2830;
  --sage: #b06a72;
  --sage-dim: #6b444a;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}

body.no-anim, body.no-anim * {
  transition: none !important;
  animation: none !important;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 20px 100px;
}

/* ---------- Top bar ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.topbar__date {
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 0.01em;
  flex: 1;
}

.icon-btn {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: none;
  color: var(--text);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:hover {
  border-color: var(--sage);
}

.ring {
  position: relative;
  width: 56px;
  height: 56px;
  flex: none;
}

.ring__svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring__track {
  fill: none;
  stroke: var(--line);
  stroke-width: 5;
}

.ring__fill {
  fill: none;
  stroke: var(--sage);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.45s ease;
}

.ring__label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

/* ---------- Hero ---------- */

.hero {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  margin: 0 0 24px;
  max-width: 15ch;
}

/* ---------- Tabs ---------- */

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.tabs__btn {
  appearance: none;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  padding: 10px 4px;
  margin-right: 20px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transform: translateY(1px);
}

.tabs__btn.is-active {
  color: var(--text);
  border-bottom-color: var(--sage);
}

/* ---------- Checklist ---------- */

.category {
  margin-bottom: 28px;
}

.category__title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 10px;
  color: var(--text);
}

.category__list {
  display: flex;
  flex-direction: column;
}

.item-wrap {
  border-bottom: 1px solid var(--line);
}

.item-wrap:last-child {
  border-bottom: none;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 0;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
  cursor: pointer;
  user-select: none;
}

.item__box {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.item__mark {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  position: relative;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.item__mark::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 2px;
  width: 6px;
  height: 11px;
  border: solid var(--bg);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0);
  transition: transform 0.15s ease;
}

.item__box:checked + .item__mark {
  background: var(--sage);
  border-color: var(--sage);
}

.item__box:checked + .item__mark::after {
  transform: rotate(45deg) scale(1);
}

.item__box:focus-visible + .item__mark {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

.item__text {
  font-size: 15px;
  line-height: 1.4;
}

.item__box:checked ~ .item__text {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--line);
}

.info-btn {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: none;
  color: var(--text-dim);
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.info-btn:hover {
  border-color: var(--amber);
  color: var(--text);
}

.item-info {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.5;
  padding: 0 0 14px 34px;
}

.item-info[hidden] {
  display: none;
}

/* ---------- Jauge d'eau ---------- */

.water {
  padding: 0 0 16px 34px;
}

.water__bar-track {
  height: 8px;
  border-radius: 4px;
  background: var(--line);
  overflow: hidden;
  margin-bottom: 10px;
}

.water__bar-fill {
  height: 100%;
  border-radius: 4px;
  width: 0%;
  background: var(--sage-dim);
  transition: width 0.3s ease, background 0.3s ease;
}

.water__bar-fill.is-goal {
  background: var(--sage);
}

.water__row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.water__input {
  width: 66px;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  padding: 6px 8px;
}

.water__unit {
  font-size: 12px;
  color: var(--text-dim);
  margin-right: 4px;
}

.water__quick {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: none;
  color: var(--text);
  cursor: pointer;
  font-family: var(--font-body);
}

.water__quick:hover {
  border-color: var(--sage);
}

.water__goal-note {
  font-size: 11.5px;
  color: var(--text-dim);
  margin-top: 8px;
}

/* ---------- History / Stats view ---------- */

.view[hidden] {
  display: none;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 12px;
  margin-bottom: 6px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.stats__item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stats__value {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 500;
}

.stats__label {
  font-size: 12px;
  color: var(--text-dim);
}

.last-saved {
  font-size: 12px;
  color: var(--text-dim);
  margin: 14px 0 28px;
}

/* ---------- Camembert ---------- */

.piesection {
  margin-bottom: 32px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line);
}

.piesection__title {
  font-family: var(--font-display);
  font-size: 17px;
  margin: 0 0 16px;
}

.piechart-row {
  display: flex;
  align-items: center;
  gap: 20px;
}

.piechart {
  width: 116px;
  height: 116px;
  border-radius: 50%;
  flex: none;
  background: var(--bg-raised);
}

.pielegend {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 12.5px;
  flex: 1;
  min-width: 0;
}

.pielegend__item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pielegend__dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
}

.pielegend__label {
  color: var(--text-dim);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pielegend__pct {
  color: var(--text);
  font-weight: 500;
  flex: none;
}

.pielegend__empty {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.5;
}

.calendar__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.calendar__month {
  font-family: var(--font-display);
  font-size: 17px;
}

.calendar__nav {
  appearance: none;
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.calendar__grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar__dow {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  padding-bottom: 4px;
}

.calendar__cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 5px;
  background: var(--bg-raised);
  border: 1px solid var(--line);
}

.calendar__cell--empty {
  background: none;
  border: none;
}

.calendar__cell--today {
  border-color: var(--amber);
}

.calendar__num {
  font-size: 11px;
  color: var(--text-dim);
}

.calendar__cell[data-intensity="zero"] {
  background: var(--bg-raised);
}

.calendar__cell[data-intensity="low"] {
  background: color-mix(in srgb, var(--sage) 25%, var(--bg-raised));
}

.calendar__cell[data-intensity="mid"] {
  background: color-mix(in srgb, var(--sage) 50%, var(--bg-raised));
}

.calendar__cell[data-intensity="high"] {
  background: color-mix(in srgb, var(--sage) 75%, var(--bg-raised));
}

.calendar__cell[data-intensity="full"] {
  background: var(--sage);
}

.calendar__cell[data-intensity="full"] .calendar__num,
.calendar__cell[data-intensity="high"] .calendar__num {
  color: var(--bg);
}

/* ---------- Backup ---------- */

.backup {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.backup__text {
  font-size: 13px;
  color: var(--text-dim);
  margin: 0 0 14px;
  line-height: 1.5;
}

.backup__actions {
  display: flex;
  gap: 10px;
}

.btn {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  border: none;
}

.btn--ghost {
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
}

.btn--ghost:hover {
  border-color: var(--sage);
}

/* ---------- Modale Réglages ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}

.modal-overlay[hidden] {
  display: none;
}

.modal {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  width: min(340px, 100%);
}

.modal__title {
  font-family: var(--font-display);
  font-size: 19px;
  margin: 0 0 20px;
}

.modal__section {
  margin-bottom: 22px;
}

.modal__label {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: block;
}

.theme-grid {
  display: flex;
  gap: 12px;
}

.theme-swatch {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}

.theme-swatch.is-active {
  border-color: var(--text);
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toggle-row .modal__label {
  margin-bottom: 0;
}

.switch {
  position: relative;
  width: 42px;
  height: 24px;
  flex: none;
}

.switch input {
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  position: absolute;
  cursor: pointer;
  z-index: 1;
}

.switch__track {
  position: absolute;
  inset: 0;
  background: var(--line);
  border-radius: 12px;
  transition: background 0.2s ease;
}

.switch__thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: var(--text);
  border-radius: 50%;
  transition: transform 0.2s ease;
}

.switch input:checked + .switch__track {
  background: var(--sage);
}

.switch input:checked ~ .switch__thumb {
  transform: translateX(18px);
}

.modal__close {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: none;
  background: var(--sage);
  color: var(--bg);
  font-family: var(--font-body);
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 12px);
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar__date" id="todayDate">—</div>
    <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙</button>
    <div class="ring" id="progressRing">
      <svg viewBox="0 0 64 64" class="ring__svg">
        <circle class="ring__track" cx="32" cy="32" r="28"></circle>
        <circle class="ring__fill" id="ringFill" cx="32" cy="32" r="28"></circle>
      </svg>
      <span class="ring__label" id="ringLabel">0%</span>
    </div>
  </header>

  <h1 class="hero" id="heroMessage">Ta journée commence ici.</h1>

  <nav class="tabs" role="tablist">
    <button class="tabs__btn is-active" id="tabToday" role="tab" aria-selected="true">Aujourd'hui</button>
    <button class="tabs__btn" id="tabHistory" role="tab" aria-selected="false">Statistiques</button>
  </nav>

  <main id="viewToday" class="view">
    <div id="checklistRoot"></div>
  </main>

  <main id="viewHistory" class="view" hidden>
    <section class="stats">
      <div class="stats__item">
        <span class="stats__value" id="statStreak">0</span>
        <span class="stats__label">jours de suite</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="statBestStreak">0</span>
        <span class="stats__label">record de suite</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="statMonthAvg">0%</span>
        <span class="stats__label">moyenne du mois</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="statBest">0%</span>
        <span class="stats__label">meilleur jour</span>
      </div>
    </section>

    <p class="last-saved" id="lastSaved">Dernière sauvegarde : —</p>

    <section class="piesection">
      <h2 class="piesection__title">Répartition des tâches</h2>
      <div class="piechart-row">
        <div class="piechart" id="pieChart"></div>
        <div class="pielegend" id="pieLegend"></div>
      </div>
    </section>

    <section class="calendar">
      <div class="calendar__head">
        <button id="calPrev" class="calendar__nav" aria-label="Mois précédent">‹</button>
        <span id="calMonthLabel" class="calendar__month">—</span>
        <button id="calNext" class="calendar__nav" aria-label="Mois suivant">›</button>
      </div>
      <div class="calendar__grid" id="calendarGrid"></div>
    </section>

    <section class="backup">
      <p class="backup__text">Tes données restent sur cet appareil. Exporte-les régulièrement pour ne rien perdre.</p>
      <div class="backup__actions">
        <button id="exportBtn" class="btn btn--ghost">Exporter</button>
        <button id="importBtn" class="btn btn--ghost">Importer</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </section>
  </main>

</div>

<div class="modal-overlay" id="settingsModal" hidden>
  <div class="modal">
    <h2 class="modal__title">Réglages</h2>

    <div class="modal__section">
      <span class="modal__label">Ambiance de couleur</span>
      <div class="theme-grid" id="themeGrid">
        <button class="theme-swatch" data-theme="default" style="background:#7a8c6f" aria-label="Charbon (défaut)"></button>
        <button class="theme-swatch" data-theme="nuit" style="background:#7691b5" aria-label="Nuit bleutée"></button>
        <button class="theme-swatch" data-theme="foret" style="background:#7fa06a" aria-label="Forêt"></button>

    <div class="modal__section toggle-row">
      <span class="modal__label">Animations</span>

        <input type="checkbox" id="animToggle" checked>
        <span class="switch__track"></span>
        <span class="switch__thumb"></span>
      </label>

    <button class="modal__close" id="closeSettings">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Modifie cette liste librement. Chaque item a besoin d'un "id" unique et
// stable (ne le change pas une fois que tu as commencé à cocher des jours).
// "info" est optionnel : un court texte affiché derrière le bouton (i).
// "type: water" active la jauge d'hydratation au lieu d'une simple case.

const CHECKLIST_CATEGORIES = [
  {
    id: "hydratation",
    label: "Hydratation",
    items: [
      { id: "eau-reveil", text: "Un verre d'eau au réveil" },
      {

        text: "Boire 1,5 à 2L dans la journée",

      },
    ],
  },
  {

    label: "Nutrition",
    items: [
      { id: "petit-dej", text: "Petit-déjeuner équilibré" },
      { id: "fruits-legumes", text: "Au moins une portion de fruits ou légumes" },
      { id: "pas-grignotage", text: "Pas de grignotage sucré / ultra-transformé" },
      {
        id: "pas-excitants-soir",
        text: "Pas de café ni d'alcool en soirée",
        info: "Coupe la caféine plusieurs heures avant le coucher pour ne pas perturber le sommeil.",
      },
    ],
  },
  {
    id: "sport",

    items: [
      {

        text: "Au moins 30 min de mouvement",
        info: "Marche rapide, vélo, sport, ménage énergique... tout compte tant que le rythme cardiaque monte un peu.",
      },
      {
        id: "etirements",
        text: "Étirements ou mobilité",
        info: "5 à 10 min : dos, jambes, épaules, ou une petite séance de mobilité articulaire.",
      },
      { id: "lumiere-naturelle", text: "Sortir prendre l'air / lumière du jour" },
      {
        id: "pause-active",
        text: "Bouger un peu toutes les heures si assis longtemps",
        info: "Se lever 1 à 2 min par heure aide la circulation et la concentration.",
      },
    ],
  },
  {
    id: "hygiene",
    label: "Hygiène",
    items: [
      { id: "douche", text: "Douche" },
      { id: "dents-matin", text: "Brossage des dents — matin" },
      { id: "dents-soir", text: "Brossage des dents — soir" },
      { id: "peau", text: "Soin de peau" },
      { id: "lavage-mains", text: "Lavage des mains régulier" },
    ],
  },
  {
    id: "sommeil",
    label: "Sommeil",
    items: [
      {
        id: "heure-reguliere",
        text: "Coucher à heure raisonnable",
        info: "Vise un horaire similaire chaque soir, autant que possible.",
      },
      {
        id: "pas-ecran-lit",
        text: "Pas d'écran juste avant de dormir",
        info: "Idéalement 30 à 60 min sans écran avant de dormir.",
      },
    ],
  },
  {
    id: "mental",
    label: "Mental & bien-être",
    items: [
      { id: "calme", text: "Quelques minutes de calme / respiration" },
      { id: "social", text: "Un vrai contact social dans la journée" },
      { id: "temps-plaisir", text: "10 min pour quelque chose que tu aimes" },
    ],
  },
  {
    id: "organisation",
    label: "Environnement & organisation",
    items: [
      { id: "aerer", text: "Aérer" },
      { id: "lit-fait", text: "Faire son lit" },
      { id: "planifier", text: "Planifier les tâches du jour" },
    ],
  },
];


(() => {
  "use strict";

  const STORAGE_HISTORY = "rituel_history_v1";
  const STORAGE_CURRENT = "rituel_current_v1";
  const STORAGE_SETTINGS = "rituel_settings_v1";

  const TOTAL_ITEMS = CHECKLIST_CATEGORIES.reduce((n, c) => n + c.items.length, 0);
  const PIE_COLORS = ["#7a8c6f", "#d8a24a", "#6f87ae", "#b06a72", "#5f9b95", "#9a9a5f", "#8f6f9b"];

  // ---------- Utils ----------

  function todayKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function writeJSON(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("is-visible");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("is-visible"), 2200);
  }

  function findItemById(id) {
    for (const cat of CHECKLIST_CATEGORIES) {
      const item = cat.items.find((i) => i.id === id);
      if (item) return item;
    }
    return null;
  }

  // ---------- State ----------

  let history = readJSON(STORAGE_HISTORY, {});
  let current = readJSON(STORAGE_CURRENT, null);
  let settings = readJSON(STORAGE_SETTINGS, { theme: "default", animations: true });

  function ensureFreshDay() {
    const key = todayKey();
    if (!current || current.date !== key) {
      if (current && current.date) {
        const done = Object.keys(current.checked || {}).length;
        history[current.date] = {
          checked: current.checked || {},
          total: TOTAL_ITEMS,
          done,
          water: current.water || 0,
        };
        writeJSON(STORAGE_HISTORY, history);
      }
      current = { date: key, checked: {}, water: 0, savedAt: null };
      writeJSON(STORAGE_CURRENT, current);
    }
    if (typeof current.water !== "number") current.water = 0;
  }

  function saveCurrent() {
    current.savedAt = Date.now();
    writeJSON(STORAGE_CURRENT, current);
    const done = Object.keys(current.checked).length;
    history[current.date] = {
      checked: current.checked,
      total: TOTAL_ITEMS,
      done,
      water: current.water || 0,
      savedAt: current.savedAt,
    };
    writeJSON(STORAGE_HISTORY, history);
  }

  // ---------- Settings ----------

  function applySettings() {
    document.documentElement.setAttribute("data-theme", settings.theme);
    document.body.classList.toggle("no-anim", !settings.animations);
  }

  function refreshThemeButtons() {
    document.querySelectorAll(".theme-swatch").forEach((btn) => {
      btn.classList.toggle("is-active", btn.dataset.theme === settings.theme);
    });
  }

  function setupSettings() {
    const modal = document.getElementById("settingsModal");

    document.getElementById("settingsBtn").addEventListener("click", () => {
      modal.hidden = false;
      refreshThemeButtons();
    });
    document.getElementById("closeSettings").addEventListener("click", () => {
      modal.hidden = true;
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.hidden = true;
    });

    document.querySelectorAll(".theme-swatch").forEach((btn) => {
      btn.addEventListener("click", () => {
        settings.theme = btn.dataset.theme;
        writeJSON(STORAGE_SETTINGS, settings);
        applySettings();
        refreshThemeButtons();
      });
    });

    const animToggle = document.getElementById("animToggle");
    animToggle.checked = settings.animations;
    animToggle.addEventListener("change", () => {
      settings.animations = animToggle.checked;
      writeJSON(STORAGE_SETTINGS, settings);
      applySettings();
    });
  }

  // ---------- Rendering: checklist ----------

  function createItemElement(item) {
    const wrap = document.createElement("div");
    wrap.className = "item-wrap";

    const row = document.createElement("div");
    row.className = "item-row";

    const label = document.createElement("label");
    label.className = "item";

    const box = document.createElement("input");
    box.type = "checkbox";
    box.className = "item__box";
    box.checked = !!current.checked[item.id];
    box.addEventListener("change", () => {
      if (box.checked) current.checked[item.id] = true;
      else delete current.checked[item.id];
      saveCurrent();
      updateRing();
      updateHero();
    });

    const mark = document.createElement("span");
    mark.className = "item__mark";

    const text = document.createElement("span");
    text.className = "item__text";
    text.textContent = item.text;

    label.appendChild(box);
    label.appendChild(mark);
    label.appendChild(text);
    row.appendChild(label);

    let infoPanel = null;
    if (item.info) {
      const infoBtn = document.createElement("button");
      infoBtn.type = "button";
      infoBtn.className = "info-btn";
      infoBtn.textContent = "i";
      infoBtn.setAttribute("aria-label", "Plus d'info sur : " + item.text);
      row.appendChild(infoBtn);

      infoPanel = document.createElement("div");
      infoPanel.className = "item-info";
      infoPanel.hidden = true;
      infoPanel.textContent = item.info;

      infoBtn.addEventListener("click", () => {
        infoPanel.hidden = !infoPanel.hidden;
      });
    }

    wrap.appendChild(row);
    if (infoPanel) wrap.appendChild(infoPanel);

    if (item.type === "water") {
      wrap.appendChild(createWaterControls(item, box));
    }

    return wrap;
  }

  function createWaterControls(item, checkboxEl) {
    const waterBlock = document.createElement("div");
    waterBlock.className = "water";

    const track = document.createElement("div");
    track.className = "water__bar-track";
    const fill = document.createElement("div");
    fill.className = "water__bar-fill";
    track.appendChild(fill);
    waterBlock.appendChild(track);

    const rowEl = document.createElement("div");
    rowEl.className = "water__row";

    const unit = document.createElement("span");
    unit.className = "water__unit";
    unit.textContent = "Bu :";

    const input = document.createElement("input");
    input.type = "number";
    input.step = "0.1";
    input.min = "0";
    input.inputMode = "decimal";
    input.className = "water__input";
    input.setAttribute("aria-label", "Litres bus aujourd'hui");

    const litreLabel = document.createElement("span");
    litreLabel.className = "water__unit";
    litreLabel.textContent = "L";

    const btn250 = document.createElement("button");
    btn250.type = "button";
    btn250.className = "water__quick";
    btn250.textContent = "+250 mL";

    const btn500 = document.createElement("button");
    btn500.type = "button";
    btn500.className = "water__quick";
    btn500.textContent = "+500 mL";

    rowEl.appendChild(unit);
    rowEl.appendChild(input);
    rowEl.appendChild(litreLabel);
    rowEl.appendChild(btn250);
    rowEl.appendChild(btn500);
    waterBlock.appendChild(rowEl);

    const note = document.createElement("p");
    note.className = "water__goal-note";
    note.textContent = "Objectif recommandé : 1,5 à 2L";
    waterBlock.appendChild(note);

    function refresh() {
      const ml = current.water || 0;
      const pct = Math.min(100, Math.round((ml / item.goalMaxMl) * 100));
      fill.style.width = pct + "%";
      fill.classList.toggle("is-goal", ml >= item.goalMinMl);
      input.value = (ml / 1000).toFixed(1);
      if (ml >= item.goalMinMl && !current.checked[item.id]) {
        current.checked[item.id] = true;
        checkboxEl.checked = true;
        updateRing();
        updateHero();
      }
    }

    function setWater(ml) {
      current.water = Math.max(0, Math.round(ml));
      saveCurrent();
      refresh();
      updateRing();
      updateHero();
    }

    input.addEventListener("change", () => {
      const liters = parseFloat(input.value);
      setWater(isNaN(liters) ? 0 : liters * 1000);
    });
    btn250.addEventListener("click", () => setWater((current.water || 0) + 250));
    btn500.addEventListener("click", () => setWater((current.water || 0) + 500));

    refresh();
    return waterBlock;
  }

  function renderChecklist() {
    const root = document.getElementById("checklistRoot");
    root.innerHTML = "";

    CHECKLIST_CATEGORIES.forEach((category) => {
      const section = document.createElement("section");
      section.className = "category";

      const heading = document.createElement("h2");
      heading.className = "category__title";
      heading.textContent = category.label;
      section.appendChild(heading);

      const list = document.createElement("div");
      list.className = "category__list";

      category.items.forEach((item) => {
        list.appendChild(createItemElement(item));
      });

      section.appendChild(list);
      root.appendChild(section);
    });
  }

  function todayCount() {
    return Object.keys(current.checked).length;
  }

  function todayPercent() {
    return Math.round((todayCount() / TOTAL_ITEMS) * 100);
  }

  function updateRing() {
    const pct = todayPercent();
    const fill = document.getElementById("ringFill");
    const label = document.getElementById("ringLabel");
    const circumference = 2 * Math.PI * 28;
    const offset = circumference * (1 - pct / 100);
    fill.style.strokeDasharray = `${circumference}`;
    fill.style.strokeDashoffset = `${offset}`;
    label.textContent = `${pct}%`;
  }

  const HERO_MESSAGES = [
    { min: 0, max: 0, text: "Ta journée commence ici." },
    { min: 1, max: 39, text: "C'est parti, continue." },
    { min: 40, max: 69, text: "Bonne dynamique aujourd'hui." },
    { min: 70, max: 99, text: "Presque tout coché." },
    { min: 100, max: 100, text: "Journée complète. Bien joué." },
  ];

  function updateHero() {
    const pct = todayPercent();
    const match = HERO_MESSAGES.find((m) => pct >= m.min && pct <= m.max);
    document.getElementById("heroMessage").textContent = match ? match.text : "Ta journée commence ici.";
  }

  function updateDateLabel() {
    const el = document.getElementById("todayDate");
    const d = new Date();
    const formatted = d.toLocaleDateString("fr-BE", { weekday: "long", day: "numeric", month: "long" });
    el.textContent = formatted.charAt(0).toUpperCase() + formatted.slice(1);
  }

  // ---------- Tabs ----------

  function setupTabs() {
    const tabToday = document.getElementById("tabToday");
    const tabHistory = document.getElementById("tabHistory");
    const viewToday = document.getElementById("viewToday");
    const viewHistory = document.getElementById("viewHistory");

    tabToday.addEventListener("click", () => {
      tabToday.classList.add("is-active");
      tabHistory.classList.remove("is-active");
      tabToday.setAttribute("aria-selected", "true");
      tabHistory.setAttribute("aria-selected", "false");
      viewToday.hidden = false;
      viewHistory.hidden = true;
    });

    tabHistory.addEventListener("click", () => {
      tabHistory.classList.add("is-active");
      tabToday.classList.remove("is-active");
      tabHistory.setAttribute("aria-selected", "true");
      tabToday.setAttribute("aria-selected", "false");
      viewToday.hidden = true;
      viewHistory.hidden = false;
      renderHistory();
    });
  }

  // ---------- History / Stats / Calendar ----------

  let calendarCursor = new Date();

  function dayPercent(dateKey) {
    const entry = history[dateKey];
    if (!entry) return null;
    return Math.round((entry.done / entry.total) * 100);
  }

  function computeStreak() {
    let streak = 0;
    let cursor = new Date();
    while (true) {
      const key = todayKey(cursor);
      const pct = dayPercent(key);
      if (pct === 100) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function computeBestStreakEver() {
    const keys = Object.keys(history).sort();
    let best = 0;
    let chain = 0;
    let prevKey = null;
    keys.forEach((key) => {
      const pct = dayPercent(key);
      if (pct === 100) {
        if (prevKey) {
          const diffDays = Math.round((new Date(key) - new Date(prevKey)) / 86400000);
          chain = diffDays === 1 ? chain + 1 : 1;
        } else {
          chain = 1;
        }
        best = Math.max(best, chain);
        prevKey = key;
      } else {
        chain = 0;
        prevKey = null;
      }
    });
    return best;
  }

  function computeMonthAverage(year, month) {
    const days = Object.keys(history).filter((k) => {
      const [y, m] = k.split("-").map(Number);
      return y === year && m === month + 1;
    });
    if (days.length === 0) return 0;
    const sum = days.reduce((acc, k) => acc + dayPercent(k), 0);
    return Math.round(sum / days.length);
  }

  function computeBestDay() {
    const values = Object.keys(history).map(dayPercent);
    if (values.length === 0) return 0;
    return Math.max(...values);
  }

  function computeCategoryDistribution() {
    const counts = {};
    CHECKLIST_CATEGORIES.forEach((cat) => (counts[cat.id] = 0));
    Object.values(history).forEach((entry) => {
      const checked = entry.checked || {};
      CHECKLIST_CATEGORIES.forEach((cat) => {
        cat.items.forEach((item) => {
          if (checked[item.id]) counts[cat.id]++;
        });
      });
    });
    return CHECKLIST_CATEGORIES.map((cat, i) => ({
      id: cat.id,
      label: cat.label,
      count: counts[cat.id],
      color: PIE_COLORS[i % PIE_COLORS.length],
    }));
  }

  function renderPieChart() {
    const data = computeCategoryDistribution().filter((d) => d.count > 0);
    const pie = document.getElementById("pieChart");
    const legend = document.getElementById("pieLegend");
    legend.innerHTML = "";

    if (data.length === 0) {
      pie.style.background = "var(--bg-raised)";
      const empty = document.createElement("p");
      empty.className = "pielegend__empty";
      empty.textContent = "Coche quelques tâches pour voir apparaître ta répartition.";
      legend.appendChild(empty);
      return;
    }

    const total = data.reduce((a, d) => a + d.count, 0);
    let cursor = 0;
    const stops = [];
    data.forEach((d) => {
      const share = (d.count / total) * 100;
      stops.push(`${d.color} ${cursor}% ${cursor + share}%`);
      cursor += share;
    });
    pie.style.background = `conic-gradient(${stops.join(", ")})`;

    [...data]
      .sort((a, b) => b.count - a.count)
      .forEach((d) => {
        const row = document.createElement("div");
        row.className = "pielegend__item";
        const dot = document.createElement("span");
        dot.className = "pielegend__dot";
        dot.style.background = d.color;
        const label = document.createElement("span");
        label.className = "pielegend__label";
        label.textContent = d.label;
        const pct = document.createElement("span");
        pct.className = "pielegend__pct";
        pct.textContent = Math.round((d.count / total) * 100) + "%";
        row.appendChild(dot);
        row.appendChild(label);
        row.appendChild(pct);
        legend.appendChild(row);
      });
  }

  function renderLastSaved() {
    const el = document.getElementById("lastSaved");
    if (!current.savedAt) {
      el.textContent = "Dernière sauvegarde : rien coché aujourd'hui pour l'instant";
      return;
    }
    const d = new Date(current.savedAt);
    const time = d.toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" });
    el.textContent = `Dernière sauvegarde : aujourd'hui à ${time}`;
  }

  function renderStats() {
    document.getElementById("statStreak").textContent = computeStreak();
    document.getElementById("statBestStreak").textContent = computeBestStreakEver();
    const y = calendarCursor.getFullYear();
    const m = calendarCursor.getMonth();
    document.getElementById("statMonthAvg").textContent = `${computeMonthAverage(y, m)}%`;
    document.getElementById("statBest").textContent = `${computeBestDay()}%`;
    renderLastSaved();
    renderPieChart();
  }

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const year = calendarCursor.getFullYear();
    const month = calendarCursor.getMonth();

    const label = calendarCursor.toLocaleDateString("fr-BE", { month: "long", year: "numeric" });
    document.getElementById("calMonthLabel").textContent = label.charAt(0).toUpperCase() + label.slice(1);

    const firstOfMonth = new Date(year, month, 1);
    const startOffset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    ["L", "M", "M", "J", "V", "S", "D"].forEach((d) => {
      const el = document.createElement("div");
      el.className = "calendar__dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    for (let i = 0; i < startOffset; i++) {
      const filler = document.createElement("div");
      filler.className = "calendar__cell calendar__cell--empty";
      grid.appendChild(filler);
    }

    const todayStr = todayKey();

    for (let day = 1; day <= daysInMonth; day++) {
      const dateObj = new Date(year, month, day);
      const key = todayKey(dateObj);
      const pct = dayPercent(key);

      const cell = document.createElement("div");
      cell.className = "calendar__cell";
      if (key === todayStr) cell.classList.add("calendar__cell--today");

      let intensity = "none";
      if (pct !== null) {
        if (pct >= 100) intensity = "full";
        else if (pct >= 70) intensity = "high";
        else if (pct >= 40) intensity = "mid";
        else if (pct > 0) intensity = "low";
        else intensity = "zero";
      }
      cell.dataset.intensity = intensity;
      cell.title = pct !== null ? `${key} — ${pct}%` : key;

      const num = document.createElement("span");
      num.className = "calendar__num";
      num.textContent = day;
      cell.appendChild(num);

      grid.appendChild(cell);
    }
  }

  function renderHistory() {
    renderStats();
    renderCalendar();
  }

  function setupCalendarNav() {
    document.getElementById("calPrev").addEventListener("click", () => {
      calendarCursor.setMonth(calendarCursor.getMonth() - 1);
      renderHistory();
    });
    document.getElementById("calNext").addEventListener("click", () => {
      calendarCursor.setMonth(calendarCursor.getMonth() + 1);
      renderHistory();
    });
  }

  // ---------- Export / Import ----------

  function setupBackup() {
    document.getElementById("exportBtn").addEventListener("click", () => {
      const payload = { history, current, settings, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `rituel-backup-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Sauvegarde exportée");
    });

    const importInput = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (data.history) {
          history = { ...history, ...data.history };
          writeJSON(STORAGE_HISTORY, history);
        }
        if (data.settings) {
          settings = { ...settings, ...data.settings };
          writeJSON(STORAGE_SETTINGS, settings);
          applySettings();
          refreshThemeButtons();
        }
        if (data.current && data.current.date === todayKey()) {
          current = data.current;
          if (typeof current.water !== "number") current.water = 0;
          writeJSON(STORAGE_CURRENT, current);
          renderChecklist();
          updateRing();
          updateHero();
        }
        renderHistory();
        showToast("Données importées");
      } catch {
        showToast("Fichier invalide");
      }
      importInput.value = "";
    });
  }

  // ---------- Init ----------

  function init() {
    applySettings();
    ensureFreshDay();
    updateDateLabel();
    renderChecklist();
    updateRing();
    updateHero();
    setupTabs();
    setupCalendarNav();
    setupBackup();
    setupSettings();

    setInterval(() => {
      const before = current.date;
      ensureFreshDay();
      if (current.date !== before) {
        renderChecklist();
        updateRing();
        updateHero();
        updateDateLabel();
      }
    }, 60 * 1000);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
