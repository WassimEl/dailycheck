<style>
:root {
  --bg: #171512;
  --bg-raised: #1e1b17;
  --text: #f5f1e8;
  --text-dim: #a89f8f;
  --line: #33302a;
  --sage: #7a8c6f;
  --sage-dim: #4f5a48;
  --amber: #d8a24a;
  --font-display: "Fraunces", serif;
  --font-body: "Space Grotesk", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 20px 100px;
}

/* ---------- Top bar ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.topbar__date {
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 0.01em;
}

.ring {
  position: relative;
  width: 56px;
  height: 56px;
  flex: none;
}

.ring__svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring__track {
  fill: none;
  stroke: var(--line);
  stroke-width: 5;
}

.ring__fill {
  fill: none;
  stroke: var(--sage);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.45s ease;
}

.ring__label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

/* ---------- Hero ---------- */

.hero {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  margin: 0 0 24px;
  max-width: 15ch;
}

/* ---------- Tabs ---------- */

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.tabs__btn {
  appearance: none;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  padding: 10px 4px;
  margin-right: 20px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transform: translateY(1px);
}

.tabs__btn.is-active {
  color: var(--text);
  border-bottom-color: var(--sage);
}

/* ---------- Checklist ---------- */

.category {
  margin-bottom: 28px;
}

.category__title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 10px;
  color: var(--text);
}

.category__list {
  display: flex;
  flex-direction: column;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
}

.item:last-child {
  border-bottom: none;
}

.item__box {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.item__mark {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  position: relative;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.item__mark::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 2px;
  width: 6px;
  height: 11px;
  border: solid var(--bg);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0);
  transition: transform 0.15s ease;
}

.item__box:checked + .item__mark {
  background: var(--sage);
  border-color: var(--sage);
}

.item__box:checked + .item__mark::after {
  transform: rotate(45deg) scale(1);
}

.item__box:focus-visible + .item__mark {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

.item__text {
  font-size: 15px;
  line-height: 1.4;
}

.item__box:checked ~ .item__text {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--line);
}

/* ---------- History view ---------- */

.view[hidden] {
  display: none;
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.stats__item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stats__value {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 500;
}

.stats__label {
  font-size: 12px;
  color: var(--text-dim);
}

.calendar__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.calendar__month {
  font-family: var(--font-display);
  font-size: 17px;
}

.calendar__nav {
  appearance: none;
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.calendar__grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar__dow {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  padding-bottom: 4px;
}

.calendar__cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 5px;
  background: var(--bg-raised);
  border: 1px solid var(--line);
}

.calendar__cell--empty {
  background: none;
  border: none;
}

.calendar__cell--today {
  border-color: var(--amber);
}

.calendar__num {
  font-size: 11px;
  color: var(--text-dim);
}

.calendar__cell[data-intensity="zero"] {
  background: var(--bg-raised);
}

.calendar__cell[data-intensity="low"] {
  background: color-mix(in srgb, var(--sage) 25%, var(--bg-raised));
}

.calendar__cell[data-intensity="mid"] {
  background: color-mix(in srgb, var(--sage) 50%, var(--bg-raised));
}

.calendar__cell[data-intensity="high"] {
  background: color-mix(in srgb, var(--sage) 75%, var(--bg-raised));
}

.calendar__cell[data-intensity="full"] {
  background: var(--sage);
}

.calendar__cell[data-intensity="full"] .calendar__num,
.calendar__cell[data-intensity="high"] .calendar__num {
  color: var(--bg);
}

/* ---------- Backup ---------- */

.backup {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.backup__text {
  font-size: 13px;
  color: var(--text-dim);
  margin: 0 0 14px;
  line-height: 1.5;
}

.backup__actions {
  display: flex;
  gap: 10px;
}

.btn {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  border: none;
}

.btn--ghost {
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
}

.btn--ghost:hover {
  border-color: var(--sage);
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 12px);
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar__date" id="todayDate">—</div>
    <div class="ring" id="progressRing">
      <svg viewBox="0 0 64 64" class="ring__svg">
        <circle class="ring__track" cx="32" cy="32" r="28"></circle>
        <circle class="ring__fill" id="ringFill" cx="32" cy="32" r="28"></circle>
      </svg>
      <span class="ring__label" id="ringLabel">0%</span>
    </div>
  </header>

  <h1 class="hero" id="heroMessage">Ta journée commence ici.</h1>

  <nav class="tabs" role="tablist">
    <button class="tabs__btn is-active" id="tabToday" role="tab" aria-selected="true">Aujourd'hui</button>
    <button class="tabs__btn" id="tabHistory" role="tab" aria-selected="false">Historique</button>
  </nav>

  <main id="viewToday" class="view">
    <div id="checklistRoot"></div>
  </main>

  <main id="viewHistory" class="view" hidden>
    <section class="stats">
      <div class="stats__item">
        <span class="stats__value" id="statStreak">0</span>
        <span class="stats__label">jours de suite</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="statMonthAvg">0%</span>
        <span class="stats__label">moyenne du mois</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="statBest">0%</span>
        <span class="stats__label">meilleur jour</span>
      </div>
    </section>

    <section class="calendar">
      <div class="calendar__head">
        <button id="calPrev" class="calendar__nav" aria-label="Mois précédent">‹</button>
        <span id="calMonthLabel" class="calendar__month">—</span>
        <button id="calNext" class="calendar__nav" aria-label="Mois suivant">›</button>
      </div>
      <div class="calendar__grid" id="calendarGrid"></div>
    </section>

    <section class="backup">
      <p class="backup__text">Tes données restent sur cet appareil. Exporte-les régulièrement pour ne rien perdre.</p>
      <div class="backup__actions">
        <button id="exportBtn" class="btn btn--ghost">Exporter</button>
        <button id="importBtn" class="btn btn--ghost">Importer</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </section>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
// Modifie cette liste librement : ajoute, supprime ou renomme des items.
// Chaque item a besoin d'un "id" unique et stable (ne le change pas une fois
// que tu as commencé à cocher des jours, sinon l'historique ne suivra plus cet item).

const CHECKLIST_CATEGORIES = [
  {
    id: "hydratation",
    label: "Hydratation",
    items: [
      { id: "eau-reveil", text: "Un verre d'eau au réveil" },
      { id: "eau-2l", text: "1,5 à 2L d'eau dans la journée" },
    ],
  },
  {
    id: "nutrition",
    label: "Nutrition",
    items: [
      { id: "petit-dej", text: "Petit-déjeuner équilibré" },
      { id: "repas-complets", text: "Déjeuner et dîner sans sauter de repas" },
      { id: "fruits-legumes", text: "Au moins une portion de fruits ou légumes" },
      { id: "pas-grignotage", text: "Pas de grignotage sucré / ultra-transformé" },
    ],
  },
  {
    id: "sport",
    label: "Activité physique",
    items: [
      { id: "bouger-30min", text: "Au moins 30 min de mouvement" },
      { id: "etirements", text: "Étirements ou mobilité" },
      { id: "lumiere-naturelle", text: "Sortir prendre l'air / lumière du jour" },
    ],
  },
  {
    id: "hygiene",
    label: "Hygiène",
    items: [
      { id: "douche", text: "Douche" },
      { id: "dents-matin", text: "Brossage des dents — matin" },
      { id: "dents-soir", text: "Brossage des dents — soir" },
      { id: "peau", text: "Soin de peau de base" },
    ],
  },
  {
    id: "sommeil",
    label: "Sommeil",
    items: [
      { id: "heure-reguliere", text: "Coucher à heure raisonnable" },
      { id: "pas-ecran-lit", text: "Pas d'écran juste avant de dormir" },
    ],
  },
  {
    id: "mental",
    label: "Mental & bien-être",
    items: [
      { id: "calme", text: "Quelques minutes de calme / respiration" },
      { id: "social", text: "Un vrai contact social dans la journée" },
      { id: "temps-plaisir", text: "10 min pour quelque chose que tu aimes" },
    ],
  },
  {
    id: "organisation",
    label: "Environnement & organisation",
    items: [
      { id: "aerer", text: "Aérer le logement" },
      { id: "lit-fait", text: "Faire son lit" },
      { id: "planifier", text: "Planifier les tâches du jour" },
    ],
  },
];


(() => {
  "use strict";

  const STORAGE_HISTORY = "rituel_history_v1"; // { "YYYY-MM-DD": { checked: {id:true}, total, done } }
  const STORAGE_CURRENT = "rituel_current_v1"; // { date: "YYYY-MM-DD", checked: {id:true} }

  const TOTAL_ITEMS = CHECKLIST_CATEGORIES.reduce((n, c) => n + c.items.length, 0);

  // ---------- Utils ----------

  function todayKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function writeJSON(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("is-visible");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("is-visible"), 2200);
  }

  // ---------- State ----------

  let history = readJSON(STORAGE_HISTORY, {});
  let current = readJSON(STORAGE_CURRENT, null);

  function ensureFreshDay() {
    const key = todayKey();
    if (!current || current.date !== key) {
      // Archive the previous day if it had checked state
      if (current && current.date) {
        const done = Object.keys(current.checked || {}).length;
        history[current.date] = { checked: current.checked || {}, total: TOTAL_ITEMS, done };
        writeJSON(STORAGE_HISTORY, history);
      }
      current = { date: key, checked: {} };
      writeJSON(STORAGE_CURRENT, current);
    }
  }

  function saveCurrent() {
    writeJSON(STORAGE_CURRENT, current);
    // Mirror today's live progress into history too, so "today" shows up
    // immediately in stats/calendar without waiting for the next reset.
    const done = Object.keys(current.checked).length;
    history[current.date] = { checked: current.checked, total: TOTAL_ITEMS, done };
    writeJSON(STORAGE_HISTORY, history);
  }

  // ---------- Rendering: checklist ----------

  function renderChecklist() {
    const root = document.getElementById("checklistRoot");
    root.innerHTML = "";

    CHECKLIST_CATEGORIES.forEach((category) => {
      const section = document.createElement("section");
      section.className = "category";

      const heading = document.createElement("h2");
      heading.className = "category__title";
      heading.textContent = category.label;
      section.appendChild(heading);

      const list = document.createElement("div");
      list.className = "category__list";

      category.items.forEach((item) => {
        const row = document.createElement("label");
        row.className = "item";

        const box = document.createElement("input");
        box.type = "checkbox";
        box.className = "item__box";
        box.checked = !!current.checked[item.id];
        box.addEventListener("change", () => {
          if (box.checked) current.checked[item.id] = true;
          else delete current.checked[item.id];
          saveCurrent();
          updateRing();
          updateHero();
        });

        const mark = document.createElement("span");
        mark.className = "item__mark";

        const text = document.createElement("span");
        text.className = "item__text";
        text.textContent = item.text;

        row.appendChild(box);
        row.appendChild(mark);
        row.appendChild(text);
        list.appendChild(row);
      });

      section.appendChild(list);
      root.appendChild(section);
    });
  }

  function todayCount() {
    return Object.keys(current.checked).length;
  }

  function todayPercent() {
    return Math.round((todayCount() / TOTAL_ITEMS) * 100);
  }

  function updateRing() {
    const pct = todayPercent();
    const fill = document.getElementById("ringFill");
    const label = document.getElementById("ringLabel");
    const circumference = 2 * Math.PI * 28;
    const offset = circumference * (1 - pct / 100);
    fill.style.strokeDasharray = `${circumference}`;
    fill.style.strokeDashoffset = `${offset}`;
    label.textContent = `${pct}%`;
  }

  const HERO_MESSAGES = [
    { min: 0, max: 0, text: "Ta journée commence ici." },
    { min: 1, max: 39, text: "C'est parti, continue." },
    { min: 40, max: 69, text: "Bonne dynamique aujourd'hui." },
    { min: 70, max: 99, text: "Presque tout coché." },
    { min: 100, max: 100, text: "Journée complète. Bien joué." },
  ];

  function updateHero() {
    const pct = todayPercent();
    const match = HERO_MESSAGES.find((m) => pct >= m.min && pct <= m.max);
    document.getElementById("heroMessage").textContent = match ? match.text : "Ta journée commence ici.";
  }

  function updateDateLabel() {
    const el = document.getElementById("todayDate");
    const d = new Date();
    const formatted = d.toLocaleDateString("fr-BE", { weekday: "long", day: "numeric", month: "long" });
    el.textContent = formatted.charAt(0).toUpperCase() + formatted.slice(1);
  }

  // ---------- Tabs ----------

  function setupTabs() {
    const tabToday = document.getElementById("tabToday");
    const tabHistory = document.getElementById("tabHistory");
    const viewToday = document.getElementById("viewToday");
    const viewHistory = document.getElementById("viewHistory");

    tabToday.addEventListener("click", () => {
      tabToday.classList.add("is-active");
      tabHistory.classList.remove("is-active");
      tabToday.setAttribute("aria-selected", "true");
      tabHistory.setAttribute("aria-selected", "false");
      viewToday.hidden = false;
      viewHistory.hidden = true;
    });

    tabHistory.addEventListener("click", () => {
      tabHistory.classList.add("is-active");
      tabToday.classList.remove("is-active");
      tabHistory.setAttribute("aria-selected", "true");
      tabToday.setAttribute("aria-selected", "false");
      viewToday.hidden = true;
      viewHistory.hidden = false;
      renderHistory();
    });
  }

  // ---------- History / Calendar ----------

  let calendarCursor = new Date(); // month currently displayed

  function dayPercent(dateKey) {
    const entry = history[dateKey];
    if (!entry) return null;
    return Math.round((entry.done / entry.total) * 100);
  }

  function computeStreak() {
    let streak = 0;
    let cursor = new Date();
    // count backwards from today while the day is at 100%
    while (true) {
      const key = todayKey(cursor);
      const pct = dayPercent(key);
      if (pct === 100) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function computeMonthAverage(year, month) {
    const days = Object.keys(history).filter((k) => {
      const [y, m] = k.split("-").map(Number);
      return y === year && m === month + 1;
    });
    if (days.length === 0) return 0;
    const sum = days.reduce((acc, k) => acc + dayPercent(k), 0);
    return Math.round(sum / days.length);
  }

  function computeBestDay() {
    const values = Object.keys(history).map(dayPercent);
    if (values.length === 0) return 0;
    return Math.max(...values);
  }

  function renderStats() {
    document.getElementById("statStreak").textContent = computeStreak();
    const y = calendarCursor.getFullYear();
    const m = calendarCursor.getMonth();
    document.getElementById("statMonthAvg").textContent = `${computeMonthAverage(y, m)}%`;
    document.getElementById("statBest").textContent = `${computeBestDay()}%`;
  }

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const year = calendarCursor.getFullYear();
    const month = calendarCursor.getMonth();

    const label = calendarCursor.toLocaleDateString("fr-BE", { month: "long", year: "numeric" });
    document.getElementById("calMonthLabel").textContent = label.charAt(0).toUpperCase() + label.slice(1);

    const firstOfMonth = new Date(year, month, 1);
    // Monday-first offset
    const startOffset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    ["L", "M", "M", "J", "V", "S", "D"].forEach((d) => {
      const el = document.createElement("div");
      el.className = "calendar__dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    for (let i = 0; i < startOffset; i++) {
      const filler = document.createElement("div");
      filler.className = "calendar__cell calendar__cell--empty";
      grid.appendChild(filler);
    }

    const todayStr = todayKey();

    for (let day = 1; day <= daysInMonth; day++) {
      const dateObj = new Date(year, month, day);
      const key = todayKey(dateObj);
      const pct = dayPercent(key);

      const cell = document.createElement("div");
      cell.className = "calendar__cell";
      if (key === todayStr) cell.classList.add("calendar__cell--today");

      let intensity = "none";
      if (pct !== null) {
        if (pct >= 100) intensity = "full";
        else if (pct >= 70) intensity = "high";
        else if (pct >= 40) intensity = "mid";
        else if (pct > 0) intensity = "low";
        else intensity = "zero";
      }
      cell.dataset.intensity = intensity;
      cell.title = pct !== null ? `${key} — ${pct}%` : key;

      const num = document.createElement("span");
      num.className = "calendar__num";
      num.textContent = day;
      cell.appendChild(num);

      grid.appendChild(cell);
    }
  }

  function renderHistory() {
    renderStats();
    renderCalendar();
  }

  function setupCalendarNav() {
    document.getElementById("calPrev").addEventListener("click", () => {
      calendarCursor.setMonth(calendarCursor.getMonth() - 1);
      renderHistory();
    });
    document.getElementById("calNext").addEventListener("click", () => {
      calendarCursor.setMonth(calendarCursor.getMonth() + 1);
      renderHistory();
    });
  }

  // ---------- Export / Import ----------

  function setupBackup() {
    document.getElementById("exportBtn").addEventListener("click", () => {
      const payload = { history, current, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `rituel-backup-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Sauvegarde exportée");
    });

    const importInput = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (data.history) {
          history = { ...history, ...data.history };
          writeJSON(STORAGE_HISTORY, history);
        }
        if (data.current && data.current.date === todayKey()) {
          current = data.current;
          writeJSON(STORAGE_CURRENT, current);
          renderChecklist();
          updateRing();
          updateHero();
        }
        renderHistory();
        showToast("Données importées");
      } catch {
        showToast("Fichier invalide");
      }
      importInput.value = "";
    });
  }

  // ---------- Init ----------

  function init() {
    ensureFreshDay();
    updateDateLabel();
    renderChecklist();
    updateRing();
    updateHero();
    setupTabs();
    setupCalendarNav();
    setupBackup();

    // Re-check for a day rollover if the app is left open past midnight.
    setInterval(() => {
      const before = current.date;
      ensureFreshDay();
      if (current.date !== before) {
        renderChecklist();
        updateRing();
        updateHero();
        updateDateLabel();
      }
    }, 60 * 1000);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
